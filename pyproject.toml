[project]
name = "tokenshield"
version = "0.1.0"
description = "Local FastAPI proxy that reduces LLM token usage with semantic caching."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "httpx",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
